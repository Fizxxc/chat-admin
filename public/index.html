<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portofolio Saya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800">
  <!-- Chat Box -->
  <section class="bg-white max-w-xl mx-auto mt-12 p-6 rounded-xl shadow-lg" data-aos="fade-up">
    <h2 class="text-xl font-bold mb-4 text-indigo-600">💬 Kirim Pesan ke Admin</h2>
    <ul id="messages" class="space-y-2 max-h-60 overflow-y-auto mb-4 text-sm"></ul>
    <div class="flex gap-2">
      <input id="message" placeholder="Tulis pesan..." class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
      <button onclick="sendMessage()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">Kirim</button>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/client.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.js"></script>
  <script>AOS.init();</script>
</body>
</html>
